all_features: outputs/strict_rot_exclusion_v2/features_with_manual_rot.csv
source_manifest: data/manifests/dataset_manifest.csv
source_dataset: data/split_v1
boundary_audit: outputs/grading_standard_manual_v4_final/audit/boundary_review_audit.csv
